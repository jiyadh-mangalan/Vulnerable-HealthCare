{% extends "base.html" %}

{% block title %}Search{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto py-10 sm:px-6 lg:px-8">
    <div class="px-4 py-5 bg-white shadow sm:rounded-lg sm:p-6">
        <h3 class="text-lg font-medium leading-6 text-gray-900">Search Results</h3>
        <div class="mt-2 text-sm text-gray-500">
            <!-- VULNERABILITY: Reflected XSS -->
            <p>You searched for: <span class="font-bold text-teal-600">{{ query | safe }}</span></p>
        </div>

        <div class="mt-8 border-t border-gray-200 pt-8">
            <p class="text-gray-500 italic">No exact matches found in the medical database for "{{ query | safe }}".</p>
        </div>
    </div>
</div>
{% endblock %}
